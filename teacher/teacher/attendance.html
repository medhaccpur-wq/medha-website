<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Sign In</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#eef2f7;
    margin:0;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#243e90;
}

.info{
    font-size:20px;
    font-weight:bold;
    margin:10px 0;
}

video{
    width:100%;
    border-radius:15px;
    margin-top:20px;
}

canvas{
    display:none;
}

button{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#243e90;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1b3175;
}

#status{
    margin-top:20px;
    text-align:center;
    font-weight:bold;
    color:green;
}
</style>
</head>

<body>

<div class="container">

<h1>Attendance Sign In</h1>

<div class="info" id="date"></div>
<div class="info" id="time"></div>
<div class="info" id="gps">GPS Status: Waiting...</div>

<video id="video" autoplay playsinline></video>

<canvas id="canvas"></canvas>

<button onclick="captureSelfie()">Capture Selfie</button>

<button onclick="signIn()">Sign In</button>

<div id="status"></div>

</div>

<script>

const video = document.getElementById("video");

document.getElementById("date").innerHTML =
"Date: " + new Date().toLocaleDateString();

setInterval(()=>{
document.getElementById("time").innerHTML =
"Time: " + new Date().toLocaleTimeString();
},1000);

navigator.mediaDevices.getUserMedia({
video:true
})
.then(stream=>{
video.srcObject = stream;
})
.catch(error=>{
alert("Camera Error: " + error.message);
});

navigator.geolocation.getCurrentPosition(
(position)=>{
document.getElementById("gps").innerHTML =
"GPS Captured ✓";
},
(error)=>{
document.getElementById("gps").innerHTML =
"GPS Failed";
}
);

function captureSelfie(){

const canvas = document.getElementById("canvas");

canvas.width = video.videoWidth;
canvas.height = video.videoHeight;

canvas.getContext("2d")
.drawImage(video,0,0);

alert("Selfie Captured");
}

function signIn(){

document.getElementById("status").innerHTML =
"Attendance Ready For Firebase Save";

alert("Attendance Ready For Firebase Save");
}

</script>

</body>
</html>
