```html
<script>

let courses = [];

try{
courses = JSON.parse(localStorage.getItem("courses")) || [];
}catch(error){
courses = [];
}

function saveCourses(){
localStorage.setItem(
"courses",
JSON.stringify(courses)
);
}

function getSuffix(num){
if(num===1) return "st";
if(num===2) return "nd";
if(num===3) return "rd";
return "th";
}

function generateYears(duration){

let years=[];

for(let i=1;i<=duration;i++){
years.push(i + getSuffix(i) + " Year");
}

return years;

}

function createCourse(){

const name =
document.getElementById("courseName")
.value.trim();

const duration =
parseInt(
document.getElementById("courseDuration")
.value
);

const admissionYear =
document.getElementById("admissionYear")
.value;

if(!name){

alert("Enter Course Name");

return;

}

const duplicate = courses.find(course =>

(course.name || "")
.toLowerCase()
.trim() ===

name
.toLowerCase()
.trim()

);

if(duplicate){

alert("Course already exists");

return;

}

const course = {

id: Date.now(),

name: name,

duration: duration,

admissionYear: admissionYear,

years: generateYears(duration)

};

courses.push(course);

saveCourses();

renderCourses();

document.getElementById("courseName").value = "";

}

function deleteCourse(id){

const confirmed =
confirm(
"Are you sure you want to delete this course?"
);

if(!confirmed){
return;
}

courses = courses.filter(
course => course.id !== id
);

saveCourses();

renderCourses();

}

function renderCourses(){

const container =
document.getElementById("courseContainer");

container.innerHTML = "";

courses.forEach(course=>{

let yearsHtml = "";

if(Array.isArray(course.years)){

course.years.forEach(year=>{

yearsHtml += `
<div class="year-box">
• ${year}
</div>
`;

});

}

container.innerHTML += `

<div class="course-card">

<div class="course-name">
${course.name}
</div>

<div>
Admission Year:
${course.admissionYear}
</div>

<div>
Duration:
${course.duration} Year(s)
</div>

<br>

${yearsHtml}

<button
class="delete-btn"
onclick="deleteCourse(${course.id})">
Delete
</button>

</div>

`;

});

}

renderCourses();

</script>
```
